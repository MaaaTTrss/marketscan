# MarketScan in der Cloud: rechnet alle ~15 Minuten alles neu, schickt neue
# Auffälligkeiten per ntfy aufs Handy und veröffentlicht die Seite auf GitHub Pages.
name: MarketScan

on:
  schedule:
    - cron: "*/15 * * * *"      # GitHub startet das ungefähr alle 15 Min. (manchmal etwas später)
  push:
    branches: [main]            # z. B. wenn am Mac ein Wert hinzugefügt wurde
  repository_dispatch:          # Schnell-Antworten: vom Cloudflare-Worker gestartet
    types: [telegram]
  workflow_dispatch:            # Knopf "Run workflow" auf GitHub
    inputs:
      report:
        description: "Morgenbericht jetzt sofort schicken (zum Testen)"
        type: boolean
        default: false

permissions:
  contents: write               # nur für den monatlichen "Bin noch da"-Eintrag (siehe unten)
  pages: write
  id-token: write

concurrency:
  # Cloud-Läufe nacheinander; Telegram-Schnellantworten laufen unabhängig (keine wird verworfen)
  group: radar-${{ github.event_name == 'repository_dispatch' && github.run_id || 'main' }}
  cancel-in-progress: false

jobs:
  telegram:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Europe/Berlin
      RADAR_NO_BROWSER: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RADAR_PRIVATE_KEY: ${{ secrets.RADAR_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - run: pip install -r requirements-cloud.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            alerts_state.json
            alerts_log.json
            signals_log.json
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-
      - run: python telegram_bot.py
      - name: Änderungen speichern
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add watchlist.json private.enc 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Per Telegram geändert [skip ci]"
            git pull --rebase -q && git push -q || echo "Hochladen fehlgeschlagen"
          fi

  build:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Berlin
      # ntfy ist aus (nur Telegram). Wieder an: nächste Zeile einkommentieren.
      # NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RADAR_PRIVATE_KEY: ${{ secrets.RADAR_PRIVATE_KEY }}   # entschlüsselt Depot & Alarme
      RADAR_NO_BROWSER: "1"
      FORCE_REPORT: ${{ inputs.report && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r requirements-cloud.txt

      # Merkzettel (was war schon auffällig?) + Strategie-Vergleich vom letzten Lauf holen
      - uses: actions/cache/restore@v4
        with:
          path: |
            alerts_state.json
            alerts_log.json
            signals_log.json
            report_state.json
            .cache/backtest
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - run: python build_static.py

      # Per Telegram geänderte Liste / Depot / Alarme ins Projekt zurückschreiben
      - name: Änderungen speichern
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add watchlist.json private.enc 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Per Telegram geändert [skip ci]"
            git pull --rebase -q && git push -q || echo "Hochladen fehlgeschlagen – nächster Lauf versucht es erneut"
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            alerts_state.json
            alerts_log.json
            signals_log.json
            report_state.json
            .cache/backtest
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pausiert Zeitpläne nach 60 Tagen ohne Änderungen im Projekt.
      # Deshalb einmal im Monat ein leerer Eintrag, damit der Radar weiterläuft.
      - name: Keepalive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "radar-bot"
            git config user.email "radar-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive [skip ci]"
            git push
          fi
